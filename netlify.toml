[build]
  command = "npm run build"
  publish = "dist"

# Netlify Image CDN: allowlist for remote image sources.
# Signed Supabase URLs (/storage/v1/object/sign/) are served directly
# (see src/lib/image.ts) — this covers public-bucket objects on the same project.
[images]
  remote_images = ["https://tgqydkyggzeyaptjlqxz\\.supabase\\.co/.*"]

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/sitemap-llm.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/ai/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/.well-known/ai.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
